<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | R@M3$H.N</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        .error-page {
            height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background-color: var(--light-green);
        }
        .error-code {
            font-family: 'Space Mono', monospace;
            font-size: 8rem;
            color: var(--accent);
            line-height: 1;
        }
        .error-message {
            margin-bottom: 30px;
        }
        .error-message h2 {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <section class="error-page">
        <div class="container">
            <div class="error-code">404</div>
            <div class="error-message">
                <h2>Lost in the Wilderness?</h2>
                <p>The page you are looking for doesn't exist or has been moved.</p>
            </div>
            <a href="index.html" class="btn btn-primary">Return Home</a>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2026 Ramesh Nagaraj.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/theme.js"></script>
</body>
</html>
